<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Green Leaf Nursery — Order on WhatsApp</title>
<style>
  :root {
    --bg: #0e1511; --card: #16211a; --line: #2c3a30;
    --txt: #eef5ef; --dim: #9cb3a4;
    --brand: #25d366; /* WhatsApp green */
    --accent: #4ade80; /* leaf green */
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--txt); padding-bottom: 92px; }
  header { padding: 28px 18px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, #1e1b18, #12100e); position: sticky; top: 0; z-index: 5; }
  .shop-name { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
  .tagline { color: var(--dim); font-size: 14px; margin-top: 3px; }
  .hours { color: var(--accent); font-size: 12px; font-weight: 600; margin-top: 6px; }
  main { max-width: 560px; margin: 0 auto; padding: 14px 14px 20px; }
  .cat { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin: 22px 4px 8px; }
  .item { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; }
  .i-info { flex: 1; min-width: 0; }
  .i-name { font-weight: 600; font-size: 15px; }
  .i-price { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .i-btn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: none; background: var(--accent); color: #12100e; font-size: 20px; font-weight: 700; cursor: pointer; line-height: 1; }
  .i-btn:active { transform: scale(0.9); }
  .qty { display: flex; align-items: center; gap: 8px; }
  .qty button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line); background: #26221d; color: var(--txt); font-size: 16px; cursor: pointer; }
  .qty span { min-width: 18px; text-align: center; font-weight: 700; }
  /* floating cart bar */
  #cartbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 14px calc(10px + env(safe-area-inset-bottom)); background: rgba(18,16,14,.92); backdrop-filter: blur(8px); border-top: 1px solid var(--line); }
  #cartbar-inner { max-width: 560px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  #cart-total { flex: 1; font-size: 14px; color: var(--dim); }
  #cart-total b { color: var(--txt); font-size: 17px; }
  .wa-btn { flex: none; display: inline-flex; align-items: center; gap: 8px; background: var(--brand); color: #062b16; font-weight: 800; font-size: 15px; border: none; border-radius: 999px; padding: 12px 20px; cursor: pointer; }
  .wa-btn:disabled { opacity: .45; }
  /* checkout sheet */
  #sheet { position: fixed; inset: 0; z-index: 20; display: none; }
  #sheet.open { display: grid; place-items: end center; background: rgba(0,0,0,.55); }
  .sheet-card { width: min(560px, 100%); background: var(--card); border-radius: 20px 20px 0 0; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); }
  .sheet-card h3 { margin: 0 0 12px; font-size: 18px; }
  .review { background: #14110f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.7; color: var(--dim); max-height: 30vh; overflow: auto; white-space: pre-wrap; }
  input, textarea { width: 100%; background: #14110f; border: 1px solid var(--line); border-radius: 10px; color: var(--txt); font-size: 15px; padding: 11px 12px; margin-top: 10px; font-family: inherit; }
  .row2 { display: flex; gap: 10px; margin-top: 10px; }
  .ghost { background: none; border: 1px solid var(--line); color: var(--dim); border-radius: 999px; padding: 11px 18px; font-size: 14px; cursor: pointer; }
  .footer-note { text-align: center; color: #6b6259; font-size: 11px; padding: 18px 0 6px; }
</style>
</head>
<body>

<header>
  <div class="shop-name" id="shopName"></div>
  <div class="tagline" id="tagline"></div>
  <div class="hours" id="hours"></div>
</header>

<main id="menu"></main>

<div id="cartbar">
  <div id="cartbar-inner">
    <div id="cart-total"></div>
    <button class="wa-btn" id="orderBtn" disabled>🛒 Order on WhatsApp</button>
  </div>
</div>

<div id="sheet">
  <div class="sheet-card">
    <h3>Confirm your order</h3>
    <div class="review" id="review"></div>
    <input id="custName" placeholder="Your name" autocomplete="name">
    <div class="row2">
      <input id="custPhone" placeholder="Phone (optional)" inputmode="tel" style="flex:1">
      <input id="custNote" placeholder="Note (less spicy, …)" style="flex:1">
    </div>
    <div class="row2">
      <button class="ghost" id="sheetClose">Keep shopping</button>
      <button class="wa-btn" id="sendBtn" style="flex:1; justify-content: center;">Send on WhatsApp</button>
    </div>
  </div>
</div>

<div class="footer-note">Orders arrive in the nursery's WhatsApp · live stock — we confirm availability on chat</div>

<script>
/* ═══════════════════════════════════════════════════════════════════
   SHOP CONFIG — everything the Frontend Developer agent edits when
   customizing this for a client. Change these values only.
   ═══════════════════════════════════════════════════════════════════ */
const SHOP = {
  name: "Green Leaf Nursery",
  tagline: "Plants · pots · potting mix — healthy plants, hand-picked daily",
  whatsapp: "919999999999",          // <- nursery's WhatsApp number, country code, no +, no spaces
  hours: "Open daily 8:30 – 19:00 · delivery in Trivandrum city",
  currency: "₹",
  menu: [
    { cat: "Indoor Plants", items: [
      { n: "Money Plant (Pothos)", p: 60, d: "low light, easy care" },
      { n: "Snake Plant", p: 120, d: "air-purifying, very hardy" },
      { n: "Areca Palm", p: 150, d: "balcony favourite, 2ft" },
      { n: "Peace Lily", p: 180, d: "flowers in shade" },
      { n: "Jade Plant", p: 90, d: "lucky plant, gift-ready" },
    ]},
    { cat: "Flowering & Fragrance", items: [
      { n: "Jasmine (Jathi Mullu)", p: 80, d: "fragrant, creeper" },
      { n: "Hibiscus (Chembarathi)", p: 50, d: "red/pink, free flowering" },
      { n: "Desi Rose", p: 60, d: "pot-grown, blooming size" },
    ]},
    { cat: "Kitchen Garden & Fruits", items: [
      { n: "Curry Leaf Plant", p: 40, d: "kitchen essential" },
      { n: "Grafted Mango Sapling", p: 150, d: "fruits in 2-3 years" },
      { n: "Guava Sapling", p: 120, d: "grafted, potted" },
      { n: "Tomato Seedlings", p: 35, d: "pack of 5" },
      { n: "Chilli Seedlings", p: 30, d: "pack of 5, kanthari variety" },
    ]},
    { cat: "Pots & Care", items: [
      { n: "Terracotta Pot 8\u2033", p: 70, d: "classic breathable pot" },
      { n: "Plastic Pot 10\u2033", p: 60, d: "with drainage tray" },
      { n: "Potting Mix 5kg", p: 120, d: "ready to use" },
      { n: "Cocopeat Block", p: 90, d: "expands to ~5L" },
      { n: "Organic Fertilizer 1kg", p: 80, d: "cow dung + neem blend" },
    ]},
  ],
};
/* ═══════════════════════ end of config ═════════════════════════════ */

const cart = {}; // name → qty
const $ = (id) => document.getElementById(id);

function render() {
  document.title = SHOP.name + " — Order on WhatsApp";
  $("shopName").textContent = SHOP.name;
  $("tagline").textContent = SHOP.tagline;
  $("hours").textContent = SHOP.hours;

  const menu = $("menu");
  menu.innerHTML = "";
  for (const g of SHOP.menu) {
    const h = document.createElement("div");
    h.className = "cat";
    h.textContent = g.cat;
    menu.appendChild(h);
    for (const it of g.items) {
      const row = document.createElement("div");
      row.className = "item";
      const q = cart[it.n] || 0;
      row.innerHTML =
        `<div class="i-info"><div class="i-name">${it.n}</div>` +
        `<div class="i-price">${SHOP.currency}${it.p}${it.d ? " · " + it.d : ""}</div></div>` +
        (q === 0
          ? `<button class="i-btn" aria-label="add ${it.n}">+</button>`
          : `<div class="qty"><button data-dec="1" aria-label="less">−</button><span>${q}</span><button data-inc="1" aria-label="more">+</button></div>`);
      // wire buttons
      const add = row.querySelector(".i-btn");
      if (add) add.onclick = () => { cart[it.n] = 1; render(); };
      const inc = row.querySelector("[data-inc]");
      const dec = row.querySelector("[data-dec]");
      if (inc) inc.onclick = () => { cart[it.n] = Math.min(99, q + 1); render(); };
      if (dec) dec.onclick = () => { if (q <= 1) delete cart[it.n]; else cart[it.n] = q - 1; render(); };
      menu.appendChild(row);
    }
  }

  const entries = Object.entries(cart);
  const total = entries.reduce((s, [n, q]) => s + q * priceOf(n), 0);
  const count = entries.reduce((s, [, q]) => s + q, 0);
  $("orderBtn").disabled = entries.length === 0;
  $("cart-total").innerHTML = entries.length === 0
    ? "Cart is empty"
    : `${count} item${count > 1 ? "s" : ""} · <b>${SHOP.currency}${total}</b>`;
}

function priceOf(name) {
  for (const g of SHOP.menu) for (const it of g.items) if (it.n === name) return it.p;
  return 0;
}

function orderMessage(name, phone, note) {
  const entries = Object.entries(cart);
  const lines = entries.map(([n, q]) => `• ${q} × ${n} — ${SHOP.currency}${q * priceOf(n)}`);
  const total = entries.reduce((s, [n, q]) => s + q * priceOf(n), 0);
  let m = `*New order — ${SHOP.name}*\n\n`;
  m += lines.join("\n") + `\n\n*Total: ${SHOP.currency}${total}*\n\n`;
  m += `Name: ${name || "-"}`;
  if (phone) m += `\nPhone: ${phone}`;
  if (note) m += `\nNote: ${note}`;
  return m;
}

$("orderBtn").onclick = () => {
  $("review").textContent = orderMessage($("custName").value.trim(), "", $("custNote").value.trim());
  $("sheet").classList.add("open");
};
$("sheetClose").onclick = () => $("sheet").classList.remove("open");
$("sendBtn").onclick = () => {
  const m = orderMessage($("custName").value.trim(), $("custPhone").value.trim(), $("custNote").value.trim());
  const url = `https://wa.me/${SHOP.whatsapp}?text=${encodeURIComponent(m)}`;
  window.open(url, "_blank");
  $("sheet").classList.remove("open");
};

render();
</script>
</body>
</html>
