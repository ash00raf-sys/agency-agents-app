org.gradle.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8
android.nonTransitiveRClass=true

# Termux (ARM64): Google's aapt2 build-tool binary is x86_64-only and won't
# run on the phone. Use Termux's native aapt2 instead (pkg install aapt2).
# Desktop builders: delete this line.
android.aapt2FromMavenOverride=/data/data/com.termux/files/usr/bin/aapt2
